name: One-off -- add VERCEL_PROTECTION_BYPASS secret to status-dashboard itself

# Fetches the bypass token live from Vercel's API at runtime (never
# hardcoded in this file) and pipes it straight into `gh secret set`,
# masked in the log -- the plaintext value never touches git history.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  add-secret:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ secrets.ACC0_PAT }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Guard
        run: |
          if [ -z "$GH_TOKEN" ] || [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::ACC0_PAT or VERCEL_TOKEN not set"
            exit 1
          fi

      - name: Fetch the bypass token from Vercel and set it as a repo secret
        run: |
          set -e
          BYPASS_VALUE=$(curl -sS "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            | jq -r '.protectionBypass | to_entries[] | select(.value.scope == "automation-bypass") | .key' | head -1)
          if [ -z "$BYPASS_VALUE" ] || [ "$BYPASS_VALUE" == "null" ]; then
            echo "::error::could not read a protectionBypass token from Vercel"
            exit 1
          fi
          echo "::add-mask::$BYPASS_VALUE"
          echo "$BYPASS_VALUE" | gh secret set VERCEL_PROTECTION_BYPASS \
            --repo mohammadlali0707-stack/status-dashboard
          echo "Secret set."

      - name: Confirm it now shows in the repo's secret list (names only, no values)
        run: |
          gh secret list --repo mohammadlali0707-stack/status-dashboard
