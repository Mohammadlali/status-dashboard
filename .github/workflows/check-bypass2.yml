name: One-off -- re-check Protection Bypass secret + test it against the live site

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_PROTECTION_BYPASS: ${{ secrets.VERCEL_PROTECTION_BYPASS }}
      VERCEL_PROTECTION_BYPASS_NEW: ${{ secrets.VERCEL_PROTECTION_BYPASS_NEW }}
    steps:
      - name: Check whether status-dashboard itself has the bypass secret set
        run: |
          if [ -z "$VERCEL_PROTECTION_BYPASS" ] && [ -z "$VERCEL_PROTECTION_BYPASS_NEW" ]; then
            echo "NEITHER VERCEL_PROTECTION_BYPASS NOR VERCEL_PROTECTION_BYPASS_NEW is set on status-dashboard."
          else
            echo "At least one bypass secret IS set on status-dashboard."
          fi

      - name: Read project protectionBypass field from Vercel
        run: |
          curl -sS "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            | jq '.protectionBypass'

      - name: Test the bypass header against the live site (only if this repo has a value)
        run: |
          TOKEN="${VERCEL_PROTECTION_BYPASS:-$VERCEL_PROTECTION_BYPASS_NEW}"
          if [ -z "$TOKEN" ]; then
            echo "No bypass token available on this repo -- skipping the live test."
            exit 0
          fi
          CODE=$(curl -sS -o /tmp/resp.html -w '%{http_code}' \
            -H "x-vercel-protection-bypass: $TOKEN" \
            -H "x-vercel-set-bypass-cookie: true" \
            "https://status2.airboxvip.top/api/status")
          echo "HTTP $CODE"
          head -c 200 /tmp/resp.html
