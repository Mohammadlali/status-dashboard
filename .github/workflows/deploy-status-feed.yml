name: Deploy Status Dashboard

# Fleet-wide ops status dashboard for status.airboxvip.top (CCP gates +
# Control-Room gates + all 9 accounts). Moved out of
# Mohammadlali/Claud-Cloud-Project 2026-09-11 -- it was never CCP-specific,
# it just used to live in CCP's repo. Same Vercel project name
# ("claud-cloud-status", see vercel.json) and the same VERCEL_TOKEN carry
# over from the old location, so the live domain alias is unaffected by
# the move.
#
# - Deploys the static site + api/* functions (repo root) to Vercel
#   project 'status-dashboard'.
# - READ-FIRST Cloudflare DNS check: adds only the status subdomain CNAME if missing;
#   never modifies or deletes any existing DNS records.
#
# Cutover 2026-09-12: the 5-minute DATA refresh (status.json) moved to
# Mohammadlali/agw-workers' deploy-status-feed-remote.yml, and status.json
# itself moved out of git entirely into Cloudflare R2 -- see that
# workflow's own header and api/status.js for why (this repo's old
# 5-minute `vercel deploy` cycle blew through Vercel's free-tier cap of
# 100 deployments/day). This workflow now only deploys actual SITE CODE
# (index.html/app.js/style.css/api/**), which changes rarely -- triggered
# by pushes to those paths, plus manual dispatch for ad-hoc redeploys.

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.js'
      - 'style.css'
      - 'manifest.json'
      - 'sw.js'
      - 'vercel.json'
      - 'api/**'
      - 'icons/**'
  workflow_dispatch:
    inputs:
      subdomain:
        description: 'Target subdomain on airboxvip.top'
        required: false
        default: 'status.airboxvip.top'
        type: string
      deploy_vercel:
        description: 'Deploy static site to Vercel'
        required: false
        default: true
        type: boolean
      ensure_dns:
        description: 'Ensure Cloudflare DNS CNAME record exists'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  deploy-feed:
    name: Build and Deploy Status Dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Ensure Cloudflare DNS Record
        if: ${{ inputs.ensure_dns != false }}
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          SUBDOMAIN="${{ inputs.subdomain || 'status.airboxvip.top' }}"
          python3 Tools/ensure_cloudflare_dns.py --zone airboxvip.top --subdomain "$SUBDOMAIN" --target cname.vercel-dns.com

      - name: Deploy to Vercel
        if: ${{ inputs.deploy_vercel != false }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          SUBDOMAIN="${{ inputs.subdomain || 'status.airboxvip.top' }}"
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN not provided -- skipping Vercel deployment."
            exit 0
          fi
          echo "Deploying repo root to Vercel project 'claud-cloud-status'..."
          DEPLOY_OUTPUT=""
          if npx --yes vercel build --prod --token="$VERCEL_TOKEN" --yes; then
            DEPLOY_OUTPUT=$(npx --yes vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN" --yes)
          else
            DEPLOY_OUTPUT=$(timeout 180 npx --yes vercel deploy --prod --token="$VERCEL_TOKEN" --yes || echo "")
          fi
          echo "Deployment raw output: $DEPLOY_OUTPUT"

          DEPLOY_URL=$(echo "$DEPLOY_OUTPUT" | grep -Eo 'https://[a-zA-Z0-9.-]+\.vercel\.app' | head -n 1)
          if [ -z "$DEPLOY_URL" ]; then
            if [ -n "$DEPLOY_OUTPUT" ]; then
              DEPLOY_URL="$DEPLOY_OUTPUT"
            else
              echo "::error::No deployment URL retrieved; cannot assign domain alias."
              exit 1
            fi
          fi

          # Vercel alias-readiness race condition: see the original CCP-hosted
          # workflow's history (run 34619809977) -- a fresh deployment is not
          # always immediately "ready" for aliasing. Retry with backoff and
          # fail the job for real if it never succeeds; never silently swallow
          # with `|| true`.
          echo "Assigning domain alias $SUBDOMAIN to $DEPLOY_URL..."
          ALIAS_OK=false
          for attempt in $(seq 1 24); do
            if npx --yes vercel alias set "$DEPLOY_URL" "$SUBDOMAIN" --token="$VERCEL_TOKEN"; then
              ALIAS_OK=true
              break
            fi
            echo "Alias attempt $attempt failed (deployment likely not ready yet); retrying in 15s..."
            sleep 15
          done
          if [ "$ALIAS_OK" != "true" ]; then
            echo "::error::Could not assign domain alias after 24 attempts (6 minutes); $SUBDOMAIN still points at the previous deployment."
            exit 1
          fi

      - name: Deployment Verification Summary
        run: |
          SUBDOMAIN="${{ inputs.subdomain || 'status.airboxvip.top' }}"
          echo "============================================="
          echo "STATUS DASHBOARD DEPLOYMENT COMPLETED"
          echo "Target Subdomain: https://$SUBDOMAIN"
          echo "Vercel Project: claud-cloud-status"
          echo "Verification commands:"
          echo "  curl -I https://$SUBDOMAIN"
          echo "  curl -s https://$SUBDOMAIN/api/status | jq .overview"
          echo "============================================="
