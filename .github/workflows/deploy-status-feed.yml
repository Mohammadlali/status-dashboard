name: Deploy Status Dashboard

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.js'
      - 'style.css'
      - 'manifest.json'
      - 'sw.js'
      - 'vercel.json'
      - 'api/**'
      - 'icons/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Build and Deploy to ACC6 Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Deploy to Vercel
        run: |
          set -e
          if [ -z "$VERCEL_TOKEN" ]; then echo "::error::secrets.VERCEL_TOKEN is not set"; exit 1; fi
          echo "Deploying to Vercel project (VERCEL_PROJECT_ID=$VERCEL_PROJECT_ID)..."
          DEPLOY_OUTPUT=""
          if npx --yes vercel build --prod --token="$VERCEL_TOKEN" --yes; then
            DEPLOY_OUTPUT=$(npx --yes vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN" --yes)
          else
            DEPLOY_OUTPUT=$(timeout 180 npx --yes vercel deploy --prod --token="$VERCEL_TOKEN" --yes || echo "")
          fi
          echo "Deployment raw output: $DEPLOY_OUTPUT"
          
          # We don't try to assign custom domain here yet until you migrate DNS
